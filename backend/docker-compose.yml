version: "3.9"

services:

  app:
    build: .

    container_name: erp-app

    ports:
      - "5001:5000"

    environment:
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: erp_db

    depends_on:
      - postgres

    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:15

    container_name: erp-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # prometheus:
  #   image: prom/prometheus

  #   container_name: erp-prometheus

  #   restart: unless-stopped

  #   ports:
  #     - "9090:9090"

  #   volumes:
  #     - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana

    container_name: erp-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      # - prometheus
      - loki

    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:latest

    container_name: erp-loki

    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml
      - loki_data:/loki

    command:
      - "-config.file=/etc/loki/loki.yml"

  promtail:
    image: grafana/promtail:latest

    container_name: erp-promtail

    restart: unless-stopped

    depends_on:
      - loki

    volumes:
      - ../observability/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - "-config.file=/etc/promtail/config.yml"

volumes:
  postgres_data:
  grafana_data:
  # prometheus_data:
  loki_data: