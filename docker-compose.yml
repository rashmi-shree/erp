version: "3.9"

services:

  app:
    build: .

    container_name: erp-app

    ports:
      - "5001:5000"

    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: erp_db

    depends_on:
      - postgres

    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:15

    container_name: erp-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: